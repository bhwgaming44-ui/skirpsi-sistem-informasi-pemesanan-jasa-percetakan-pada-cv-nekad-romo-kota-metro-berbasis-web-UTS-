<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" style="max-width:100%;height:auto;background:#ffffff" font-family="Segoe UI, Arial, sans-serif">
    <title>Use Case Diagram Sistem Pemesanan Jasa Percetakan CV Nekad Romo</title>
    <rect width="100%" height="100%" fill="#ffffff" />
